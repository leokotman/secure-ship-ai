<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="t">
  <title id="t">Tool ownership gate</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#ffffff"/>

  <rect x="200" y="20" width="240" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="320" y="47" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">Tool call from Ollama</text>

  <polygon points="320,90 400,130 320,170 240,130" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="320" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">Tool name?</text>

  <line x1="320" y1="64" x2="320" y2="90" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Branches -->
  <rect x="20" y="220" width="160" height="50" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">identity / SMS /</text>
  <text x="100" y="256" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">escalate tools</text>

  <rect x="220" y="220" width="160" height="50" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="300" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">lookup_shipments</text>
  <text x="300" y="256" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">get_status / details</text>

  <rect x="420" y="220" width="180" height="50" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
  <text x="510" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">Return to model</text>

  <path d="M260 130 H100 V220" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M320 170 V220" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M380 130 H510 V220" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="160" y="120" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">session tools</text>
  <text x="470" y="120" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">non-data</text>

  <!-- Gate -->
  <polygon points="300,310 380,350 300,390 220,350" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="300" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">customer_id</text>
  <text x="300" y="362" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">set?</text>

  <line x1="300" y1="270" x2="300" y2="310" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="100" y1="270" x2="100" y2="300" stroke="#334155" stroke-width="1.5"/>
  <path d="M100 300 H510" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="420" width="160" height="40" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
  <text x="120" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">not_verified / empty</text>

  <ellipse cx="420" cy="430" rx="55" ry="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <rect x="365" y="430" width="110" height="24" fill="#ecfdf5" stroke="none"/>
  <line x1="365" y1="430" x2="365" y2="454" stroke="#047857" stroke-width="1.5"/>
  <line x1="475" y1="430" x2="475" y2="454" stroke="#047857" stroke-width="1.5"/>
  <ellipse cx="420" cy="454" rx="55" ry="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="420" y="448" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#0f172a">Postgres</text>

  <path d="M240 350 H120 V420" fill="none" stroke="#be123c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="160" y="400" font-family="system-ui,sans-serif" font-size="10" fill="#be123c">no</text>
  <path d="M360 350 H420 V416" fill="none" stroke="#047857" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="400" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#047857">yes ’ owner scope</text>
</svg>
