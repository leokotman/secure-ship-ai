<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-labelledby="t">
  <title id="t">SecureShip system overview</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="320" fill="#ffffff"/>

  <!-- Boxes -->
  <rect x="24" y="120" width="100" height="48" rx="8" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="74" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">Browser</text>

  <rect x="176" y="120" width="140" height="48" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="246" y="142" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">Next.js UI + BFF</text>
  <text x="246" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">/api proxies</text>

  <rect x="368" y="120" width="110" height="48" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="423" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">FastAPI</text>

  <!-- Postgres cylinder -->
  <ellipse cx="580" cy="128" rx="52" ry="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <rect x="528" y="128" width="104" height="36" fill="#ecfdf5" stroke="none"/>
  <line x1="528" y1="128" x2="528" y2="164" stroke="#047857" stroke-width="1.5"/>
  <line x1="632" y1="128" x2="632" y2="164" stroke="#047857" stroke-width="1.5"/>
  <ellipse cx="580" cy="164" rx="52" ry="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="580" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">PostgreSQL</text>

  <rect x="368" y="240" width="130" height="48" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="433" y="269" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">Ollama (host)</text>

  <rect x="540" y="240" width="110" height="48" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
  <text x="595" y="269" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">Twilio SMS</text>

  <rect x="820" y="40" width="100" height="48" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="870" y="69" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">Auth0</text>

  <!-- Main chain arrows -->
  <line x1="124" y1="144" x2="172" y2="144" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="316" y1="144" x2="364" y2="144" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="340" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">chat / verify / session</text>
  <line x1="478" y1="144" x2="526" y2="144" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- FastAPI down to Ollama / Twilio -->
  <line x1="423" y1="168" x2="423" y2="236" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M445 168 V210 H595 V236" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Browser to Auth0 (login) -->
  <path d="M74 120 V64 H820" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="450" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#15803d">Universal Login</text>

  <!-- Auth0 back to browser callback -->
  <path d="M870 88 V100 H74 V120" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="500" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#15803d">token → /admin/callback</text>

  <!-- Browser admin JWT to FastAPI -->
  <path d="M74 168 V200 H368 V168" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="220" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#b45309">admin Bearer JWT</text>

  <!-- FastAPI JWKS to Auth0 -->
  <path d="M478 130 H700 V64 H820" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="700" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">JWKS verify</text>
</svg>
