  <rect x="170" y="20" width="90" height="36" rx="6" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="215" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">Ollama</text>

  <rect x="320" y="20" width="90" height="36" rx="6" fill="#fef3c7" stroke="#b45309"/>
