  <rect x="480" y="20" width="110" height="36" rx="6" fill="#ecfdf5" stroke="#047857"/>
  <text x="535" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">ChatWindow</text>

  <line x1="70" y1="56" x2="70" y2="300" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="215" y1="56" x2="215" y2="300" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="365" y1="56" x2="365" y2="300" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="535" y1="56" x2="535" y2="300" stroke="#cbd5e1" stroke-dasharray="3 4"/>

  <line x1="70" y1="90" x2="215" y2="90" stroke="#334155" marker-end="url(#a)"/>
  <text x="142" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">request human</text>

  <line x1="215" y1="130" x2="365" y2="130" stroke="#334155" marker-end="url(#a)"/>
  <text x="290" y="124" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">escalate_to_human</text>

