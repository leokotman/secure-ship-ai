<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="t">
  <title id="t">Conversational identity to tools</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="#ffffff"/>

  <!-- Lifeline headers -->
  <rect x="40" y="20" width="80" height="36" rx="6" fill="#eff6ff" stroke="#1e40af"/>
  <text x="80" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">User</text>

  <rect x="160" y="20" width="100" height="36" rx="6" fill="#f8fafc" stroke="#334155"/>
  <text x="210" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">Next BFF</text>

  <rect x="300" y="20" width="90" height="36" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="345" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">FastAPI</text>

  <rect x="430" y="20" width="90" height="36" rx="6" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="475" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">Ollama</text>

  <rect x="560" y="20" width="100" height="36" rx="6" fill="#ecfdf5" stroke="#047857"/>
  <text x="610" y="43" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#0f172a">Postgres</text>

  <!-- Lifelines -->
  <line x1="80" y1="56" x2="80" y2="500" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="210" y1="56" x2="210" y2="500" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="345" y1="56" x2="345" y2="500" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="475" y1="56" x2="475" y2="500" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="610" y1="56" x2="610" y2="500" stroke="#cbd5e1" stroke-dasharray="3 4"/>

  <!-- Messages -->
  <line x1="80" y1="80" x2="210" y2="80" stroke="#334155" marker-end="url(#a)"/>
  <text x="145" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">message</text>

  <line x1="210" y1="110" x2="345" y2="110" stroke="#334155" marker-end="url(#a)"/>
  <text x="277" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">POST /chat</text>

  <line x1="345" y1="140" x2="610" y2="140" stroke="#334155" marker-end="url(#a)"/>
  <text x="477" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">load session + transcript</text>

  <line x1="345" y1="170" x2="475" y2="170" stroke="#334155" marker-end="url(#a)"/>
  <text x="410" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">chat + tools</text>

  <!-- alt unverified box -->
  <rect x="300" y="190" width="340" height="100" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="312" y="208" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">alt unverified</text>
  <line x1="475" y1="230" x2="345" y2="230" stroke="#334155" marker-end="url(#a)"/>
  <text x="410" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">verify / send code</text>
  <line x1="345" y1="260" x2="610" y2="260" stroke="#334155" marker-end="url(#a)"/>
  <text x="477" y="254" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">update session</text>

  <!-- alt verified -->
  <rect x="300" y="310" width="340" height="100" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-dasharray="4 3"/>
  <text x="312" y="328" font-family="system-ui,sans-serif" font-size="11" fill="#047857">else verified + shipment intent</text>
  <line x1="475" y1="350" x2="345" y2="350" stroke="#334155" marker-end="url(#a)"/>
  <text x="410" y="344" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">lookup / get status</text>
  <line x1="345" y1="380" x2="610" y2="380" stroke="#334155" marker-end="url(#a)"/>
  <text x="477" y="374" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">query by customer_id</text>

  <line x1="345" y1="440" x2="210" y2="440" stroke="#334155" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="277" y="434" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">stream + metadata</text>

  <line x1="210" y1="470" x2="80" y2="470" stroke="#334155" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="145" y="464" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">UI + cards</text>
</svg>
